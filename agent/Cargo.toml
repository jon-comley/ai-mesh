[package]
name = "agent"
version = "0.1.0"
edition = "2024"

[features]
default  = []
llm      = ["dep:capability-llm"]
lighting = ["dep:capability-lighting"]

[dependencies]
shared = { path = "../shared" }
capability-core = { path = "../capabilities/core" }
capability-llm      = { path = "../capabilities/llm", optional = true }
capability-lighting = { path = "../capabilities/lighting", optional = true }
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
futures-util = "0.3"
dirs = "5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sysinfo = { version = "0.32", default-features = false, features = ["system"] }
mdns-sd = "0.19"
socket2 = { version = "0.5", features = ["all"] }
tokio-rustls = { version = "0.26", features = ["ring"] }
rustls = { version = "0.23", features = ["ring"] }
rustls-pemfile = "2"
sha2 = "0.10"

[dev-dependencies]
async-trait = "0.1"
