[package]
name = "llm-rotation"
version = "0.1.0"
edition = "2021"
description = "One OpenAI-compatible chat client across many LLM providers, trying free tiers before paid and resting a provider when it runs out"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jon-comley/ai-mesh"
readme = "README.md"
keywords = ["llm", "openai", "groq", "failover", "rate-limit"]
categories = ["api-bindings", "web-programming::http-client"]

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util"] }
