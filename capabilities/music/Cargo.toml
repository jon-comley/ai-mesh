[package]
name = "capability-music"
version = "0.1.0"
edition = "2024"

[dependencies]
capability-core = { path = "../core" }
shared = { path = "../../shared" }
async-trait = "0.1"
tokio = { version = "1", features = ["sync", "time", "rt", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1"
tracing = "0.1"
dirs = "5"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }

[[bin]]
name = "spotify-auth"
path = "src/bin/spotify_auth.rs"
