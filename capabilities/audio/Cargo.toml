[package]
name = "capability-audio"
version = "0.1.0"
edition = "2024"

[dependencies]
capability-core = { path = "../core" }
shared = { path = "../../shared" }
async-trait = "0.1"
tokio = { version = "1", features = ["sync", "fs", "time", "rt", "macros", "process", "io-util"] }
tracing = "0.1"
dirs = "5"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tempfile = "3"
