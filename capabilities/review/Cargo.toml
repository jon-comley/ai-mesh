[package]
name = "capability-review"
version = "0.1.0"
edition = "2024"

# mac1's code reviews: fetch repos, plan chunks, hand tasks to machines across
# the mesh, write reports. The review logic itself is the pure `codereview`
# crate; this adds git, SQLite, timers and mesh messages. docs/code-review.md.
[dependencies]
capability-core = { path = "../core" }
shared = { path = "../../shared" }
codereview = { path = "../../codereview" }
ebay = { path = "../../ebay" }
async-trait = "0.1"
tokio = { version = "1", features = ["sync", "time", "rt", "macros", "process", "fs"] }
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
dirs = "5"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tempfile = "3"
