[package]
name = "capability-llm"
version = "0.1.0"
edition = "2024"

[dependencies]
capability-core = { path = "../core" }
shared = { path = "../../shared" }
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
dirs = "5"
