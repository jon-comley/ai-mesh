[package]
name = "cli"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shared = { path = "../shared" }
prettytable = "0.10"
thiserror = "1"
crossterm = "0.27"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
