<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0d1117">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MeshDash">
  <title>AI-Mesh Dashboard</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💡</text></svg>">
  <link rel="stylesheet" href="/static/style.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <header class="app-header">
    <span class="app-title">AI-Mesh</span>
    <span class="conn-dot disconnected" id="conn-dot" title="Disconnected"></span>
  </header>

  <nav class="subtab-bar" id="subtab-bar" role="tablist" aria-label="Sections" hidden></nav>

  <main class="panels">
    <section class="panel" id="panel-nodes">
      <h2>Nodes</h2>
      <div id="node-list"><p class="placeholder">Connecting…</p></div>
    </section>

    <section class="panel" id="panel-health">
      <h2>Health</h2>
      <div id="health-charts"><p class="placeholder">No data yet.</p></div>
    </section>

    <section class="panel" id="panel-models">
      <div class="panel-head">
        <h2>Models</h2>
        <div class="panel-head-links">
          <a class="panel-head-link"
             href="https://huggingface.co/spaces/open-llm-leaderboard/open_llm_leaderboard"
             target="_blank" rel="noopener noreferrer"
             title="Open LLM Leaderboard — benchmark quality rankings (opens in a new tab)"
             aria-label="Open LLM Leaderboard — benchmark quality rankings">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <line x1="6" y1="20" x2="6" y2="14"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="18" y1="20" x2="18" y2="10"/>
            </svg>
            <span>Leaderboard</span>
          </a>
          <a class="panel-head-link"
             href="https://openrouter.ai/rankings"
             target="_blank" rel="noopener noreferrer"
             title="OpenRouter rankings — model popularity by usage (opens in a new tab)"
             aria-label="OpenRouter rankings — model popularity by usage">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/>
            </svg>
            <span>Popularity</span>
          </a>
        </div>
      </div>
      <div id="model-list"><p class="placeholder">No data yet.</p></div>
    </section>

    <section class="panel active" id="panel-home">
      <h2>Home</h2>
      <div id="home-list"><p class="placeholder">No data yet.</p></div>
    </section>

    <section class="panel" id="panel-devices">
      <div class="pair-header">
        <h2>Devices</h2>
        <button id="pair-device-btn" class="pair-btn" title="Open the Zigbee pairing window (bridge-wide — accepts lights, sensors, anything)">Pair device</button>
      </div>
      <div id="pair-feed" class="pair-feed" hidden></div>
      <div id="device-list"><p class="placeholder">No data yet.</p></div>
    </section>

    <section class="panel" id="panel-security">
      <h2>Security</h2>
      <div id="security-table"><p class="placeholder">No incidents.</p></div>
    </section>

    <section class="panel" id="panel-errors">
      <h2>Errors</h2>
      <div id="error-feed"><p class="placeholder">No errors.</p></div>
    </section>

    <section class="panel panel-chat" id="panel-chat"></section>

    <section class="panel panel-chat" id="panel-reaper"></section>

    <section class="panel" id="panel-gateway"></section>

    <section class="panel" id="panel-ebay"></section>

    <section class="panel" id="panel-chords"></section>

    <section class="panel" id="panel-reviews"></section>
  </main>

  <!-- Five categories; nav.js shows a category's panels as sub-tabs under the header. -->
  <nav class="tab-bar" role="tablist">
    <button class="tab active" data-group="home" role="tab" aria-selected="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>
      </svg>
      <span>Home</span>
    </button>

    <button class="tab" data-group="chat" role="tab" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
      </svg>
      <span>Chat</span>
    </button>

    <button class="tab" data-group="music" role="tab" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>
      </svg>
      <span>Music</span>
    </button>

    <button class="tab" data-group="tools" role="tab" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
      </svg>
      <span>Tools</span>
    </button>

    <button class="tab" data-group="system" role="tab" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="2" y="3" width="20" height="7" rx="2"/><rect x="2" y="14" width="20" height="7" rx="2"/><line x1="6" y1="6.5" x2="6.01" y2="6.5"/><line x1="6" y1="17.5" x2="6.01" y2="17.5"/>
      </svg>
      <span>System</span>
    </button>
  </nav>

  <script src="/static/dashboard.js" type="module"></script>
</body>
</html>
