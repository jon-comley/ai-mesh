<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0d1117">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MeshDash">
  <title>AI-Mesh Dashboard</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💡</text></svg>">
  <link rel="stylesheet" href="/static/style.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <header class="app-header">
    <span class="app-title">AI-Mesh</span>
    <span class="conn-dot disconnected" id="conn-dot" title="Disconnected"></span>
  </header>

  <main class="panels">
    <section class="panel active" id="panel-nodes">
      <h2>Nodes</h2>
      <div id="node-list"><p class="placeholder">Connecting…</p></div>
    </section>

    <section class="panel" id="panel-health">
      <h2>Health</h2>
      <div id="health-charts"><p class="placeholder">No data yet.</p></div>
    </section>

    <section class="panel" id="panel-models">
      <div class="panel-head">
        <h2>Models</h2>
        <div class="panel-head-links">
          <a class="panel-head-link"
             href="https://huggingface.co/spaces/open-llm-leaderboard/open_llm_leaderboard"
             target="_blank" rel="noopener noreferrer"
             title="Open LLM Leaderboard — benchmark quality rankings (opens in a new tab)"
             aria-label="Open LLM Leaderboard — benchmark quality rankings">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <line x1="6" y1="20" x2="6" y2="14"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="18" y1="20" x2="18" y2="10"/>
            </svg>
            <span>Leaderboard</span>
          </a>
          <a class="panel-head-link"
             href="https://openrouter.ai/rankings"
             target="_blank" rel="noopener noreferrer"
             title="OpenRouter rankings — model popularity by usage (opens in a new tab)"
             aria-label="OpenRouter rankings — model popularity by usage">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/>
            </svg>
            <span>Popularity</span>
          </a>
        </div>
      </div>
      <div id="model-list"><p class="placeholder">No data yet.</p></div>
    </section>

    <section class="panel" id="panel-lighting">
      <div class="pair-header">
        <h2>Lighting</h2>
        <button id="pair-device-btn" class="pair-btn" title="Open the Zigbee pairing window (bridge-wide — accepts lights, sensors, anything)">Pair device</button>
      </div>
      <div id="pair-feed" class="pair-feed" hidden></div>
      <div id="lighting-list"><p class="placeholder">No data yet.</p></div>
    </section>

    <section class="panel" id="panel-security">
      <h2>Security</h2>
      <div id="security-table"><p class="placeholder">No incidents.</p></div>
    </section>

    <section class="panel" id="panel-errors">
      <h2>Errors</h2>
      <div id="error-feed"><p class="placeholder">No errors.</p></div>
    </section>

    <section class="panel panel-chat" id="panel-chat"></section>

    <section class="panel panel-chat" id="panel-reaper"></section>

    <section class="panel" id="panel-gateway"></section>
  </main>

  <nav class="tab-bar" role="tablist">
    <button class="tab active" data-panel="nodes" role="tab" aria-selected="true" aria-controls="panel-nodes">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="5" r="2"/><circle cx="5" cy="19" r="2"/><circle cx="19" cy="19" r="2"/>
        <line x1="12" y1="7" x2="5" y2="17"/><line x1="12" y1="7" x2="19" y2="17"/>
      </svg>
      <span>Nodes</span>
    </button>

    <button class="tab" data-panel="health" role="tab" aria-selected="false" aria-controls="panel-health">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
      </svg>
      <span>Health</span>
    </button>

    <button class="tab" data-panel="models" role="tab" aria-selected="false" aria-controls="panel-models">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/>
        <line x1="9" y1="1" x2="9" y2="4"/><line x1="15" y1="1" x2="15" y2="4"/>
        <line x1="9" y1="20" x2="9" y2="23"/><line x1="15" y1="20" x2="15" y2="23"/>
      </svg>
      <span>Models</span>
    </button>

    <button class="tab" data-panel="lighting" role="tab" aria-selected="false" aria-controls="panel-lighting">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <line x1="9" y1="18" x2="15" y2="18"/><line x1="10" y1="22" x2="14" y2="22"/>
        <path d="M15.09 14c.18-.98.65-1.74 1.41-2.5A4.65 4.65 0 0 0 18 8 6 6 0 0 0 6 8c0 1 .23 2.23 1.5 3.5A4.61 4.61 0 0 1 8.91 14"/>
      </svg>
      <span>Lighting</span>
    </button>

    <button class="tab" data-panel="security" role="tab" aria-selected="false" aria-controls="panel-security">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
      </svg>
      <span>Security</span>
    </button>

    <button class="tab" data-panel="errors" role="tab" aria-selected="false" aria-controls="panel-errors">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
        <line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>
      </svg>
      <span>Errors</span>
    </button>

    <button class="tab" data-panel="chat" role="tab" aria-selected="false" aria-controls="panel-chat">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
      </svg>
      <span>Chat</span>
    </button>

    <button class="tab" data-panel="reaper" role="tab" aria-selected="false" aria-controls="panel-reaper">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <polygon points="5 3 19 12 5 21 5 3"/>
      </svg>
      <span>REAPER</span>
    </button>

    <button class="tab" data-panel="gateway" role="tab" aria-selected="false" aria-controls="panel-gateway">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/>
      </svg>
      <span>Online AI</span>
    </button>
  </nav>

  <script src="/static/dashboard.js" type="module"></script>
</body>
</html>
